<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMDB · 连接本机账号管理</title><link rel="stylesheet" href="connect.css"></head>
<body><main><div class="caption">MMDB 本机凭证助手</div><h1>连接账号管理</h1><div id="pair" hidden><p>连接后，你可以在这份管理页点击“一键抓取并导入”。扩展只读取 AI Studio 使用的 Google Cookie，并交给下方本机服务。</p><div class="destination"><strong id="origin"></strong><small id="identity"></small></div><p class="caption">本次连接不读取 Cookie，也不发送生成请求。请确认这是你刚从 MMDB 菜单 11 打开的页面。</p><div class="buttons"><button id="approve" class="primary">连接此管理服务</button><button id="cancel">取消</button></div></div><div id="home" hidden><p>从 MMDB 菜单 11 打开账号管理，首次点击“连接浏览器扩展”，之后即可一键导入。</p><p id="count"></p><button id="forget">断开所有管理服务</button><p class="caption">断开连接只移除扩展中的连接记录，已导入的账号凭证保留。</p></div><p id="feedback" role="status" aria-live="polite">正在读取…</p></main><script type="module" src="connect.mjs"></script></body></html>
